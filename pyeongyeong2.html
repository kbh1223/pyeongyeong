<head>
<meta charset="utf-8">

<title>편경 (編磬)</title>
<style>
:root{--bg:#f3ecdc;--fg:#2b2218;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--fg:#efe6d4}}
:root[data-theme="dark"]{--bg:#1d1812;--fg:#efe6d4}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Serif KR","Nanum Myeongjo",serif}
body{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{margin:6px 0 2px;font-size:1.5rem;letter-spacing:.2em}
p{margin:0 0 8px;opacity:.75;font-size:.9rem;text-align:center}
svg{width:100%;max-width:860px;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation;border-radius:8px}
.z{fill:#fff;fill-opacity:0;cursor:pointer;transition:fill-opacity .08s}
.z:hover{fill:#ffe9a8;fill-opacity:.35}
.z.hit{fill:#ffd24a;fill-opacity:.65}
.lb{font-size:13px;font-weight:700;text-anchor:middle;pointer-events:none;fill:#7a1f10;paint-order:stroke;stroke:#fff;stroke-width:3px;opacity:0;transition:opacity .15s}
.lb.on{opacity:1}
</style>
</head>

<script>
const N=[["황종","黃鍾"],["대려","大呂"],["태주","太簇"],["협종","夾鍾"],["고선","姑洗"],["중려","仲呂"],["유빈","蕤賓"],["임종","林鍾"],["이칙","夷則"],["남려","南呂"],["무역","無射"],["응종","應鍾"],["청황종","清黃鍾"],["청대려","清大呂"],["청태주","清太簇"],["청협종","清夾鍾"]];
// 돌 영역 [x, y, w, h] (이미지 좌표)
const up=[[200,80,68,112],[265,76,48,112],[324,78,46,110],[394,70,28,118],[456,70,28,118],[514,78,42,110],[564,72,46,116],[620,72,54,118]];
const lo=[[208,205,50,118],[265,205,46,120],[334,205,30,120],[396,205,22,124],[450,205,34,124],[513,205,26,122],[566,205,42,122],[620,205,50,126]];
const BASE=311.13,fr=i=>BASE*Math.pow(2,i/12);let ctx;
function play(i){
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==="suspended")ctx.resume();
  const t=ctx.currentTime,f=fr(i),o=ctx.createGain();
  o.gain.setValueAtTime(0,t);o.gain.linearRampToValueAtTime(.55,t+.004);o.gain.exponentialRampToValueAtTime(.0001,t+2.2);o.connect(ctx.destination);
  [[1,1],[2.76,.35],[5.4,.15]].forEach(([m,a])=>{
    const s=ctx.createOscillator(),g=ctx.createGain();s.frequency.value=f*m;
    g.gain.setValueAtTime(a,t);g.gain.exponentialRampToValueAtTime(.0001,t+(m===1?2.2:.5));
    s.connect(g);g.connect(o);s.start(t);s.stop(t+2.3);
  });
}
const svg=document.getElementById("s"),NS="http://www.w3.org/2000/svg";
function mk(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e}
function add(i,[x,y,w,h]){
  const r=mk("rect",{class:"z",x,y,width:w,height:h,rx:6});
  const t=mk("text",{class:"lb",x:x+w/2,y:y-6});t.textContent=N[i][0]+" "+N[i][1];
  r.addEventListener("pointerdown",e=>{e.preventDefault();play(i);
    r.classList.add("hit");t.classList.add("on");
    setTimeout(()=>r.classList.remove("hit"),150);
    clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),900);});
}
up.forEach((b,k)=>add(15-k,b));
lo.forEach((b,k)=>add(k,b));
